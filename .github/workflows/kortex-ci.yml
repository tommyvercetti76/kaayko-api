name: Kortex CI

# Runs the Kortex test suites on every push/PR that touches the API.
# Two required gates: the hardening suite first (fast — catches regressions in the
# security/product hardening), then every __tests__/kortex-*.test.js suite in band
# WITHOUT --forceExit, so a leaked handle (a timer or socket left open) fails the build.

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - '.github/workflows/kortex-ci.yml'
  pull_request:
    paths:
      - 'functions/**'
      - '.github/workflows/kortex-ci.yml'

jobs:
  kortex-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Hardening suite (fast gate)
        run: npm run test:kortex:hardening

      - name: All Kortex suites (required gate)
        run: npm run test:kortex:all
